name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan infrastructure
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_IN_AUTOMATION: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::065320271480:role/github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.3

      - name: Plan Terraform roots
        id: plan
        env:
          TF_VAR_public_access_cidrs: ${{ vars.PROD_PUBLIC_ACCESS_CIDRS }}
        run: |
          set +e
          mkdir -p plans
          failed=0
          marker='<!-- terraform-plan -->'
          printf '%s\n## Terraform plan\n\n' "$marker" > plan-comment.md

          for root in bootstrap/github-oidc shared envs/dev envs/prod; do
            name=${root//\//-}
            output="plans/${name}.txt"
            : > "$output"

            terraform -chdir="$root" init -input=false -lockfile=readonly >> "$output" 2>&1
            result=$?
            status="failed to initialize"

            if [ "$result" -eq 0 ]; then
              terraform -chdir="$root" plan \
                -compact-warnings \
                -detailed-exitcode \
                -input=false \
                -lock=false \
                -no-color >> "$output" 2>&1
              result=$?

              case "$result" in
                0) status="no changes" ;;
                2) status="changes detected" ;;
                *) status="plan failed"; failed=1 ;;
              esac
            else
              failed=1
            fi

            {
              printf '<details><summary><code>%s</code>: %s</summary>\n\n```text\n' "$root" "$status"
              sed -n '1,240p' "$output"
              if [ "$(wc -l < "$output")" -gt 240 ]; then
                printf '\n... output truncated; download the workflow artifact for the complete plan.\n'
              fi
              printf '```\n</details>\n\n'
            } >> plan-comment.md
          done

          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Upload complete plans
        if: always() && hashFiles('plan-comment.md') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: terraform-plans
          path: plans/
          retention-days: 7

      - name: Publish plan on pull request
        if: always() && hashFiles('plan-comment.md') != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.NEXUS_CICD_BOT_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const review = '\n\nReview requested: @' + context.repo.owner;
            const content = fs.readFileSync('plan-comment.md', 'utf8');
            const body = content.slice(0, 65000 - review.length) + review;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });
            const { data: viewer } = await github.rest.users.getAuthenticated();
            const existing = comments.find(comment =>
              comment.user.login === viewer.login && comment.body.includes(marker)
            );
            const request = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...request, issue_number });
            }

      - name: Fail when a plan failed
        if: steps.plan.outputs.failed == '1'
        run: exit 1
